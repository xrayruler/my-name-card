<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的名字</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: #062d1f;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .date {
        margin-top: 18px;
        font-size: 12px;
        opacity: 0.8;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <h1>我的名字</h1>
    <div class="date" id="today"></div>

    <script>
      const today = new Date();
      document.getElementById('today').textContent = today.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    </script>
  </body>
</html>
